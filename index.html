<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Project</title>
    <link rel="stylesheet" href="formattings.css">
    <link rel="stylesheet" href="debug/debug.css">
</head>
<body>
    <!-- Your visible content goes here -->
    <h1 id="pageHeader">Course Assignments List</h1>

    <!-- Toggle switch for viewing assignments vs statistics -->
    <div class="toggle-container">
        <span class="toggle-label left">View Assignments</span>

        <input type="checkbox" id="viewToggle">
        <label for="viewToggle" class="toggle"></label>

        <span class="toggle-label right">View Statistics</span>
    </div>

    <!-- Search input for filtering assignments -->
    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search by course or assignment name">
        <label>
            Entries per page:
            <input type="number" id="entriesPerPage" value="10" min="1">
        </label>
    </div>



    <table id="assignmentsTable">
        <tr> <!-- Table Headers -->
            <th data-sort="id">ID Number</th>
            <th data-sort="course">Course</th>
            <th data-sort="name">Assignment Name</th>
            <th data-sort="dueDate">Due Date</th>
            <th data-sort="status">Status</th>
            <th>Actions</th> <!-- For Edit/Delete buttons -->
        </tr>
        <tbody id="assignments">
            <!-- Table rows will be dynamically added here -->
        </tbody>
    </table>
    
    <!-- Form for adding new assignments -->
     <div id="modalOverlay">
        <div class="modal">
            <form id="assignmentForm">
                <label for="course">Course:</label>
                <input type="text" id="course" name="course" required>

                <label for="assignmentName">Assignment Name:</label>
                <input type="text" id="assignmentName" name="assignmentName" required>

                <label for="dueDate">Due Date:</label>
                <input type="date" id="dueDate" name="dueDate">

                <label for="status">Status:</label>
                <select id="status" name="status" required>
                    <option value="Not Started">Not Started</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>

                <div class="modal-actions">
                    <button type="submit">submit</button>
                </div>
            </form>
        </div>
    </div>

    <button id="addBtn" type="button">Add New Assignment</button>

    <!-- Controls for navigating the table pages -->
    <div id="paging" class="paging">
        <button id="firstPage" aria-label="First page">&lt;&lt;</button>
        <button id="prevPage" aria-label="Previous page">&lt;</button>

        <label class="page-label">
            Page
            <input type="number" id="pageInput" min="1">
            <span id="pageTotal"></span>
        </label>

        <button id="nextPage" aria-label="Next page">&gt;</button>
        <button id="lastPage" aria-label="Last page">&gt;&gt;</button>
    </div>



    <!-- The statistics for when statistic view is active -->
    <div id="statistics" style="display:none;">
        <p id="totalAssignments">Total Assignments: 0</p>
        <p id="completedAssignments">Completed Assignments: 0</p>
        <p id="inProgressAssignments">In Progress Assignments: 0</p>
        <p id="notStartedAssignments">Not Started Assignments: 0</p>
        <p id="numOfAssignmentsPerPage">Number of Assignments Per Page: 0</p>
    </div>

    <button id="purgeBtn" type="button">⚠️Purge⚠️</button>
    <button id="addTestEntriesBtn" type="button">Add Test Entries</button>
    
    <script src="code.js"></script>
    <script src="debug/debug.js"></script>
</body>
</html>
