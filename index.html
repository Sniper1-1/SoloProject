<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Justin Hooker — Portfolio</title>
	<link rel="stylesheet" href="style.css" />
	<!-- site-config must load before project-card so SITE is defined when cards render -->
	<script src="site-config.js" defer></script>
	<script src="project-card.js" defer></script>
</head>

<body>

	<!-- ── Nav ─────────────────────────────────────────────── -->
	<nav>
		<!-- data-site="name" → filled from SITE.name in site-config.js -->
		<span class="nav-logo" data-site="name"></span>
		<ul class="nav-links">
			<li><a href="#projects">Projects</a></li>
			<li><a href="#about">About</a></li>
			<!-- data-site="linkedin/github" → href filled from SITE in site-config.js -->
			<li><a data-site="linkedin" target="_blank" rel="noopener">LinkedIn</a></li>
			<li><a data-site="github"   target="_blank" rel="noopener">GitHub</a></li>
		</ul>
	</nav>

	<main class="wrapper">

		<!-- ══════════════════════════════════════════════════════
		     HERO — all three CHECK 1 elements must be visible
		     here WITHOUT scrolling
		     ══════════════════════════════════════════════════════ -->
		<section class="hero">

			<!-- CHECK 1 REQUIREMENT #1: Your name — big and obvious -->
			<h1 class="hero-name" data-site="name"></h1>

			<!-- CHECK 1 REQUIREMENT #2: Your role — reads like a job title -->
			<p class="hero-role" data-site="role"></p>

			<!--
			CHECK 1 REQUIREMENT #3: Featured project card.
			Data comes from the PROJECTS registry in project-card.js.
			"featured" switches to the hero card style.
			To feature a different project, change the id here.
			-->
			<h4 class="featured-title">Featured Project</h4>
			<project-card id="assignments-manager" featured></project-card>

		</section>

		<!-- ══════════════════════════════════════════════════════
		     BELOW THE FOLD — recruiters who scroll will see this
		     ══════════════════════════════════════════════════════ -->

		<!-- ── All Projects ──────────────────────────────────── -->
		<section id="projects">
			<h2 class="section-title">Projects</h2>

			<div class="projects-grid">

				<!--
				Same id, no "featured" attribute = regular card style.
				All data comes from project-card.js — edit it there,
				and both this card and the featured card above update.
				-->
				<project-card id="assignments-manager"></project-card>

				<!-- Team project card — add its data to PROJECTS in project-card.js -->
				<project-card id="team-project"></project-card>

			</div>
		</section>

		<!-- ── About ─────────────────────────────────────────── -->
		<section id="about">
			<h2 class="section-title">About</h2>
			<!--
			Keep this short — 2-3 sentences.
			Focus on what you can DO, not your learning journey.
			BAD:  "I'm a passionate learner who loves to explore new technologies."
			GOOD: "CS student at [School] focused on full-stack web apps.
			       Looking for a [role] where I can [value you bring]."
			-->
			<p class="about-text">
				CS student at Clemson University focused on full-stack development, cybersecurity, and artificial intelligence.
			</p>
		</section>

	</main>

	<!-- ── Footer ──────────────────────────────────────────── -->
	<footer>
		<!-- data-site="year" → filled from SITE.year in site-config.js -->
		<span>© <span data-site="year"></span> <span data-site="name"></span></span>
		<div class="footer-links">
			<a data-site="github"   target="_blank" rel="noopener">GitHub</a>
			<a data-site="linkedin" target="_blank" rel="noopener">LinkedIn</a>
		</div>
	</footer>

</body>

</html>
